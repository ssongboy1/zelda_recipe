<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>하이랄 요리 시뮬레이터</title>
  <meta name="description" content="젤다의 전설 야생의 숨결 / 왕국의 눈물 요리 결과를 미리 확인하는 시뮬레이터">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="brand-icon" aria-hidden="true">🍳</span>
      <div>
        <h1>하이랄 요리 시뮬레이터</h1>
        <p class="sub">재료를 골라 냄비에 넣으면 어떤 요리가 나오는지 알려드려요</p>
      </div>
    </div>
    <div class="game-switch" role="radiogroup" aria-label="게임 선택">
      <button type="button" role="radio" data-game="botw">야생의 숨결</button>
      <button type="button" role="radio" data-game="totk">왕국의 눈물</button>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button type="button" role="tab" data-tab="cook" class="active">요리하기</button>
    <button type="button" role="tab" data-tab="book">레시피 도감</button>
  </nav>

  <main>
    <section id="tab-cook" class="tab-panel active">
      <div class="cook-layout">
        <div class="left">
          <div class="card pot-card">
            <div class="card-head">
              <h2>냄비 <span id="pot-count" class="muted">0 / 5</span></h2>
              <div class="actions">
                <button type="button" id="btn-share" class="ghost">링크 복사</button>
                <button type="button" id="btn-clear" class="ghost">비우기</button>
              </div>
            </div>
            <div id="pot" class="pot"></div>
            <p class="hint">재료를 누르면 냄비에 들어가고, 냄비 안의 재료를 누르면 빠져요.</p>
          </div>

          <div class="card result-card" id="result" aria-live="polite"></div>
        </div>

        <div class="card picker">
          <div class="picker-head">
            <input id="search" type="search" placeholder="재료 검색 (한글/영어)" autocomplete="off">
          </div>
          <div id="cats" class="chips"></div>
          <div id="grid" class="grid"></div>
        </div>
      </div>
    </section>

    <section id="tab-book" class="tab-panel">
      <div class="card">
        <div class="picker-head">
          <input id="book-search" type="search" placeholder="요리 이름 검색" autocomplete="off">
        </div>
        <div id="book" class="book"></div>
      </div>
    </section>
  </main>

  <footer>
    <p>효과 수치(단계·지속시간·기력량)는 게임 규칙을 바탕으로 한 근사치예요. 대성공(랜덤 보너스)은 반영하지 않습니다.</p>
    <p>이미지 출처: Zelda Wiki · Zelda Dungeon Wiki · Zelda Fandom. 게임 이미지와 명칭의 저작권은 Nintendo에 있습니다. 비공식 팬 제작 도구입니다.</p>
  </footer>

  <div id="toast" class="toast" role="status"></div>

  <script src="js/data.js"></script>
  <script src="js/cook.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
